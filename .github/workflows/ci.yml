name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Self-check (installed console script)
        run: godot-hot-loops --self-check
      - name: Self-check (plain script)
        run: python3 src/godot_code_gates/list_hot_loops.py --self-check
      - name: Gate the fixture project
        working-directory: tests/fixtures/basic
        run: |
          godot-hot-loops --check
          godot-callmap signal moved
